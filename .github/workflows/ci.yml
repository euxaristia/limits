name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ''
          - os: windows-latest
            ext: '.exe'
          - os: macos-latest
            ext: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The module has no external dependencies, so there is no go.sum
          # for the built-in cache to key on.
          cache: false

      # Windows checkouts rewrite the repo's LF endings to CRLF, which gofmt
      # reports as unformatted, so this check only runs on Linux.
      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test ./... -v

      - name: Build limits Binary
        shell: bash
        run: go build -o "dist/limits${{ matrix.ext }}" .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: limits-${{ matrix.os }}
          path: dist/limits${{ matrix.ext }}
          if-no-files-found: error
