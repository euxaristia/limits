name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ''
          - os: windows-latest
            ext: '.exe'
          - os: macos-latest
            ext: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-features

      - name: Build limits Binary
        shell: bash
        run: |
          cargo build --release --all-features
          mkdir -p dist
          cp "target/release/limits${{ matrix.ext }}" "dist/limits${{ matrix.ext }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: limits-${{ matrix.os }}
          path: dist/limits${{ matrix.ext }}
          if-no-files-found: error
